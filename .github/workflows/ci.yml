name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Prefer npm ci when a full package-lock.json is present; fall back to install
      # so agents can sync source via MCP when the lockfile exceeds push payload limits.
      - run: |
          if [ -f package-lock.json ] && grep -q '"node_modules/' package-lock.json; then
            npm ci
          else
            npm install
          fi
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm test
