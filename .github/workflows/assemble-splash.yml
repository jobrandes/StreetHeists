name: Assemble splash image

on:
  push:
    branches: [main]
    paths:
      - "public/splash/street-wash.jpg.b64*"
      - ".github/workflows/assemble-splash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG from base64 parts
        run: |
          set -euo pipefail
          cd public/splash
          if [ -f street-wash.jpg.b64 ]; then
            base64 -d street-wash.jpg.b64 > street-wash.jpg
          else
            cat $(ls street-wash.jpg.b64.part* | sort) | tr -d '\n\r ' | base64 -d > street-wash.jpg
          fi
          file street-wash.jpg
          test "$(wc -c < street-wash.jpg)" -gt 1000
      - name: Commit street-wash.jpg if needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/splash/street-wash.jpg
          if git diff --cached --quiet; then
            echo "No JPEG changes to commit"
            exit 0
          fi
          git commit -m "Add public/splash/street-wash.jpg (decoded from base64 sidecar)"
          git push
