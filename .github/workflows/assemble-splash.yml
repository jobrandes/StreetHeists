name: Assemble splash image

on:
  push:
    branches: [main]
    paths:
      - "public/splash/street-wash.jpg.hex.*"
      - ".github/workflows/assemble-splash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG from hex parts
        run: |
          set -euo pipefail
          cd public/splash
          parts=$(ls street-wash.jpg.hex.h* | sort)
          echo "Parts: $parts"
          count=$(echo "$parts" | wc -w)
          echo "Part count: $count"
          test "$count" -ge 50
          cat $parts | tr -d '\n\r ' | python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))' > street-wash.jpg
          file street-wash.jpg
          size=$(wc -c < street-wash.jpg)
          echo "Decoded size: $size"
          test "$size" -eq 47758
      - name: Commit street-wash.jpg and remove part files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/splash/street-wash.jpg
          git rm -f public/splash/street-wash.jpg.b64.p* public/splash/street-wash.jpg.hex.h* || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace public/splash/street-wash.jpg with decoded splash wash"
          git push
