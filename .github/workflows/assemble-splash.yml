name: Assemble splash image

on:
  push:
    branches: [main]
    paths:
      - "public/splash/street-wash.jpg.b64*"
      - ".github/workflows/assemble-splash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG from base64 parts
        run: |
          set -euo pipefail
          cd public/splash
          parts=$(ls street-wash.jpg.b64.p* | sort)
          echo "Parts: $parts"
          cat $parts | tr -d '\n\r ' | base64 -d > street-wash.jpg
          file street-wash.jpg
          size=$(wc -c < street-wash.jpg)
          echo "Decoded size: $size"
          test "$size" -gt 40000
      - name: Commit street-wash.jpg and remove parts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/splash/street-wash.jpg
          git rm -f public/splash/street-wash.jpg.b64.p* || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace public/splash/street-wash.jpg with decoded splash wash"
          git push
